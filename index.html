<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/x-icon" href="img/3_enemies_chicken/chicken_small/1_walk/3_w.png">
    <link rel="stylesheet" href="style.css">
    <script src="models/soundhub.class.js"></script>
    <script src="models/drawable_object.class.js"></script>
    <script src="models/moveable_object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/smallchicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status_bar.class.js"></script>
    <script src="models/boss_statusbar.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/bg_object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable_object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="js/game.js" defer></script>
</head>

<body>
    <h1 id="title">EL POLLO LOCO</h1>
    <div id="fullscreen" class="content_wrapper">
        <canvas class="d_none" id="canvas" width="720" height="480">
        </canvas>

        <div class="additional_info_wrapper">
            <a href="imprint.html"><button><img class="ui_button" src="img/controls/imprint.svg" alt="imprint icon"></button></a>
            <button onclick="SoundHub.toggleMute()" id="mute_button" class="mute_button ui_button"><img src="img/controls/mute.svg"
                    alt="mute icon"></button>
        </div>

        <div class="mobile_controls_wrapper">
            <div class="move_mobile_controls">
                <button id="btn_left" class="mobile_control_button">
                    <!-- <img src="img/controls/mobile_left.svg"> -->
                </button>
                <button id="btn_right" class="mobile_control_button">
                    <!-- <img src="img/controls/mobile_right.svg"> -->
                </button>
            </div>
            <div class="action_mobile_controls">
                <button id="btn_jump" class="mobile_control_button">
                    <!-- <img src="img/controls/mobile_jump.svg"> -->
                </button>
                <button id="btn_throw" class="mobile_control_button">
                    <!-- <img src="img/controls/mobile_throw.svg"> -->
                </button>
            </div>
        </div>

        <div id="startscreen" class="screen_overlay">
            <img class="screen start_screen" src="img/9_intro_outro_screens/start/startscreen_1.png">
            <button onclick="startGame(1)" class="screen_button start_button">Start Game</button>
            <button onclick="openDialog()" class="screen_button controls_button">Controls</button>

            <dialog id="controls_dialog">
                <div class="dialog_wrapper">
                    <button class="close_dialog_button" onclick="closeDialog()"><img
                            src="img/controls/exitfullscreen.svg"></button>
                    <div class="controls_wrapper">
                        <img src="img/controls/arrows.svg" alt="left and right arrows">
                        <p>walk left and right</p>
                    </div>
                    <div class="controls_wrapper">
                        <img class="dialog_space" src="img/controls/space.svg">
                        <img class="mobile_dialog_space" src="img/controls/mobile_jump.svg">
                        <p>jump</p>
                    </div>
                    <div class="controls_wrapper">
                        <img class="dialog_throw" src="img/controls/throw.svg">
                        <img class="mobile_dialog_throw" src="img/controls/mobile_throw.svg">
                        <p>throw bottle</p>
                    </div>
                    <!-- <div class="controls_wrapper">
                        <img src="img/controls/esc.svg">
                        <p>exit fullscreen</p>
                    </div> -->
                </div>
            </dialog>
        </div>
        <div id="gameover_screen" class="d_none screen_overlay">
            <img class="screen gameover_screen" src="img/9_intro_outro_screens/game_over/game over!.png">
            <button onclick="restartCurrentLevel()" class="screen_button restart_button">Restart</button>
            <button onclick="goHome()" class="screen_button home_button">Go to Home</button>
        </div>
        <div id="win_screen" class="d_none screen_overlay">
            <img class="screen win_screen" src="img/You won, you lost/You Won B.png">
            <button onclick="restartCurrentLevel()" class="screen_button restart_button">Restart</button>
            <button onclick="goHome()" class="screen_button home_button">Go to Home</button>
            <button id="level_2_btn" onclick="startGame(2)" class="screen_button level_button">Level 2</button>
        </div>

    </div>

    <!-- <div class="fullscreen_buttons_wrapper">
        <button onclick="fullscreen()" class="ui_button"><img src="img/controls/fullscreen.svg"></button> -->
    <!-- <button onclick="closeFullscreen()" class="ui_button"><img
                src="img/controls/exitfullscreen.svg"></button> -->
    </div>
    <div class="turn_device_wrapper">
        <p>Please turn your device to play</p>
        <img src="img/controls/mobile_turndevice.svg" alt="phone with arrows">
    </div>
</body>

</html>
