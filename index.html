<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable_object.class.js"></script>
    <script src="models/moveable_object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/smallchicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status_bar.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/bg_object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable_object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>

<body>
    <div id="fullscreen">
        <h1 id="title" class="d_none">EL POLLO LOCO</h1>
        <div id="screens">

            <div id="startscreen">
                <img class="screen start_screen" src="img/9_intro_outro_screens/start/startscreen_1.png">
                <button onclick="init()">Start Game</button>
                <button onclick="openDialog()">Controls</button>

                <dialog id="controls_dialog">
                    <button onclick="closeDialog()">close</button>
                    <h2>controls</h2>
                    <img>
                    <p>left right</p>
                    <img>
                    <p>jump</p>
                    <img>
                    <p>throw bottle</p>
                </dialog>
            </div>
            <div id="gameover_screen" class="d_none">
                <img class="screen gameover_screen" src="img/9_intro_outro_screens/game_over/game over!.png">
                <button>Restart</button>
                <button>Go to Home</button>
            </div>
            <div id="win_screen" class="d_none">
                <img class="screen win_screen" src="img/You won, you lost/You Won B.png">
                <button>Restart</button>
                <button>Go to Home</button>
            </div>
        </div>

        <canvas class="d_none" id="canvas" width="720" height="480">
        </canvas>
        <button onclick="fullscreen()" id="fullscreen_button" class="ui_button"><img
                src="img/controls/fullscreen.svg"></button>
        <button onclick="closeFullscreen()" id="exit_fullscreen_button" class="ui_button"><img
                src="img/controls/exitfullscreen.svg"></button>
    </div>
</body>

</html>
